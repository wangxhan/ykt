<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一颗糖集团 | YKT Group</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <div class="header-brand" id="navBrand"></div>
    <nav class="header-nav">
      <a href="#firmList" class="nav-item" data-key="about"></a>
      <a href="#groupBiz" class="nav-item" data-key="business"></a>
      <a href="#globalNet" class="nav-item" data-key="globalNet"></a>
      <a href="#vision" class="nav-item" data-key="vision"></a>
    </nav>
    <button class="lang-toggle">ZH / EN</button>
  </div>
</header>

<section class="hero-banner">
  <div class="container">
    <h1 class="hero-title"></h1>
    <p class="hero-desc"></p>
  </div>
</section>

<!-- 第一块：所有旗下公司（名称+本行经营范围） -->
<section id="firmList" class="section-wrap">
  <div class="container">
    <h2 class="section-main-title">集团旗下法人主体明细</h2>
    <div class="firm-wrapper" id="firmContainer"></div>
  </div>
</section>

<!-- 第二块：集团整体总业务（独立分区，和公司列表完全分开） -->
<section id="groupBiz" class="section-wrap bg-light">
  <div class="container">
    <h2 class="section-main-title">集团整体三大业务体系</h2>
    <div class="biz-wrapper" id="bizContainer"></div>
  </div>
</section>

<!-- 全球网络 -->
<section id="globalNet" class="section-wrap">
  <div class="container">
    <h2 class="section-main-title">全球运营布局网络</h2>
    <ul class="global-list" id="globalList"></ul>
  </div>
</section>

<!-- 发展理念 -->
<section id="vision" class="section-wrap bg-light">
  <div class="container">
    <h2 class="section-main-title">长期发展理念</h2>
    <p class="vision-text"></p>
  </div>
</section>

<script src="./main.js"></script>
</body>
</html>
