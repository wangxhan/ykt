<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一颗糖集团</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <div class="header-brand" id="navBrand"></div>
    <nav class="header-nav">
      <a href="index.html" class="nav-item" data-key="about"></a>
      <a href="about.html" class="nav-item" data-key="business"></a>
      <a href="business.html" class="nav-item" data-key="globalNet"></a>
      <a href="contact.html" class="nav-item" data-key="vision"></a>
    </nav>
    <button class="lang-toggle" aria-label="Switch language">中文</button>
  </div>
</header>

<section class="hero-banner">
  <div class="container">
    <div class="hero-kicker" id="heroKicker"></div>
    <h1 class="hero-title"></h1>
    <p class="hero-desc"></p>
  </div>
</section>

<section class="media-showcase">
  <div class="container media-grid">
    <article class="media-card media-card-lg">
      <div class="media-image media-image-1"></div>
      <div class="media-caption">
        <span class="media-caption-label"></span>
        <strong class="media-caption-title"></strong>
      </div>
    </article>
    <article class="media-card">
      <div class="media-image media-image-2"></div>
      <div class="media-caption">
        <span class="media-caption-label"></span>
        <strong class="media-caption-title"></strong>
      </div>
    </article>
    <article class="media-card">
      <div class="media-image media-image-3"></div>
      <div class="media-caption">
        <span class="media-caption-label"></span>
        <strong class="media-caption-title"></strong>
      </div>
    </article>
  </div>
</section>

<section class="feature-band">
  <div class="container feature-band-inner">
    <div class="feature-panel feature-panel-main">
      <div class="feature-label" id="featureLabel"></div>
      <h3 id="featureTitle"></h3>
      <p id="featureDesc"></p>
    </div>
    <div class="feature-panel feature-panel-side">
      <div class="feature-metric">03</div>
      <div>
        <span id="featureSideLabel"></span>
        <strong id="featureSideValue"></strong>
      </div>
    </div>
  </div>
</section>

<section class="journey-block">
  <div class="container journey-shell">
    <div class="journey-head">
      <div class="eyebrow" id="journeyEyebrow"></div>
      <h2 id="journeyTitle"></h2>
    </div>
    <div class="journey-grid" id="journeyGrid"></div>
  </div>
</section>

<section class="capability-strip">
  <div class="container capability-grid" id="capabilityGrid"></div>
</section>

<section class="brand-values">
  <div class="container">
    <div class="value-grid" id="valueGrid"></div>
  </div>
</section>

<section class="company-overview">
  <div class="container overview-inner">
    <div class="overview-copy">
      <div class="eyebrow" id="overviewEyebrow"></div>
      <h2 id="overviewTitle"></h2>
      <p id="overviewText"></p>
    </div>
    <div class="overview-stats" id="overviewStats"></div>
  </div>
</section>

<!-- 第一块：所有旗下公司（名称+本行经营范围） -->
<section id="firmList" class="section-wrap">
  <div class="container">
    <h2 id="firmListTitle" class="section-main-title"></h2>
    <div class="firm-wrapper" id="firmContainer"></div>
  </div>
</section>

<!-- 第二块：集团整体总业务（独立分区，和公司列表完全分开） -->
<section id="groupBiz" class="section-wrap bg-light">
  <div class="container">
    <h2 id="groupBizTitle" class="section-main-title"></h2>
    <div class="biz-wrapper" id="bizContainer"></div>
  </div>
</section>

<!-- 全球网络 -->
<section id="globalNet" class="section-wrap">
  <div class="container">
    <h2 id="globalNetTitle" class="section-main-title"></h2>
    <ul class="global-list" id="globalList"></ul>
  </div>
</section>

<!-- 发展理念 -->
<section id="vision" class="section-wrap bg-light">
  <div class="container">
    <h2 id="visionTitle" class="section-main-title"></h2>
    <p class="vision-text"></p>
  </div>
</section>

<section class="cta-band">
  <div class="container cta-inner">
    <div>
      <div class="eyebrow brand-cta-eyebrow" id="ctaEyebrow"></div>
      <h3 id="ctaTitle"></h3>
    </div>
    <a href="#firmList" class="cta-button" id="ctaButton"></a>
  </div>
</section>

<footer class="site-footer">
  <div class="container footer-inner">
    <div>
      <div class="footer-brand" id="footerBrand"></div>
      <p class="footer-note" id="footerNote"></p>
    </div>
    <div class="footer-meta">
      <div class="footer-meta-item">
        <span class="meta-label" id="metaLabel1"></span>
        <span class="meta-value" id="metaValue1"></span>
      </div>
      <div class="footer-meta-item">
        <span class="meta-label" id="metaLabel2"></span>
        <span class="meta-value" id="metaValue2"></span>
      </div>
      <div class="footer-meta-item">
        <span class="meta-label" id="metaLabel3"></span>
        <span class="meta-value" id="metaValue3"></span>
      </div>
    </div>
  </div>
</footer>

<script src="./main.js"></script>
<script>
  window.pageType = 'home';
  loadSourceData();
</script>
</body>
</html>
