<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一颗糖集团 | YKT Group</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <div class="header-brand" id="navBrand"></div>
    <nav class="header-nav">
      <a href="#firmList" class="nav-item" data-key="about"></a>
      <a href="#groupBiz" class="nav-item" data-key="business"></a>
      <a href="#globalNet" class="nav-item" data-key="globalNet"></a>
      <a href="#vision" class="nav-item" data-key="vision"></a>
    </nav>
    <button class="lang-toggle" id="langBtn">中文 / EN</button>
  </div>
</header>

<section class="hero-banner">
  <div class="container">
    <h1 class="hero-title"></h1>
    <p class="hero-desc"></p>
  </div>
</section>

<section id="firmList" class="section-wrap">
  <div class="container">
    <h2 class="section-main-title" data-key="firmTitle"></h2>
    <div class="firm-wrapper" id="firmContainer"></div>
  </div>
</section>

<section id="groupBiz" class="section-wrap bg-light">
  <div class="container">
    <h2 class="section-main-title" data-key="bizTitle"></h2>
    <div class="biz-wrapper" id="bizContainer"></div>
  </div>
</section>

<section id="globalNet" class="section-wrap">
  <div class="container">
    <h2 class="section-main-title" data-key="netTitle"></h2>
    <ul class="global-list" id="globalList"></ul>
  </div>
</section>

<section id="vision" class="section-wrap bg-light">
  <div class="container">
    <h2 class="section-main-title" data-key="visionTitle"></h2>
    <p class="vision-text"></p>
  </div>
</section>

<script src="./main.js"></script>
</body>
</html>
