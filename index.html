<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一颗糖集团 | YKT Group</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- 顶部导航 -->
  <header class="header">
    <div class="container nav-wrap">
      <div class="nav-brand" id="navBrand"></div>
      <nav class="nav-menu">
        <a href="#about" class="nav-item" data-key="about"></a>
        <a href="#business" class="nav-item" data-key="business"></a>
        <a href="#global" class="nav-item" data-key="globalNet"></a>
        <a href="#vision" class="nav-item" data-key="vision"></a>
      </nav>
      <button class="lang-switch">ZH / EN</button>
    </div>
  </header>

  <!-- 首页横幅 -->
  <section class="hero block">
    <div class="container">
      <h1 class="hero-title"></h1>
      <p class="hero-desc"></p>
    </div>
  </section>

  <!-- 集团&公司列表 -->
  <section id="about" class="about block">
    <div class="container">
      <h2 class="sec-title platform-title"></h2>
      <p class="platform-desc"></p>
      <div class="company-group">
        <h3 class="group-subtitle">控股平台主体</h3>
        <div class="company-list" id="platformCompanies"></div>

        <h3 class="group-subtitle">文创板块子公司</h3>
        <div class="company-list" id="culturalCompanies"></div>

        <h3 class="group-subtitle">高原农业板块子公司</h3>
        <div class="company-list" id="agriCompanies"></div>

        <h3 class="group-subtitle">AI医疗科技子公司</h3>
        <div class="company-list" id="aiMedCompanies"></div>

        <h3 class="group-subtitle">马来西亚境外法人实体</h3>
        <div class="company-list" id="overseaCompanies"></div>
      </div>
    </div>
  </section>

  <!-- 业务板块 -->
  <section id="business" class="business block">
    <div class="container" id="businessWrap"></div>
  </section>

  <!-- 全球网络 -->
  <section id="global" class="global block">
    <div class="container">
      <h2 class="sec-title">全球运营网络</h2>
      <ul class="global-list" id="globalList"></ul>
    </div>
  </section>

  <!-- 发展理念 -->
  <section id="vision" class="vision block">
    <div class="container">
      <h2 class="sec-title">长期发展理念</h2>
      <p class="vision-text"></p>
    </div>
  </section>

  <script src="./main.js"></script>
</body>
</html>
